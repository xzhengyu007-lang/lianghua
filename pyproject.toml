[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-quant"
version = "0.1.0"
description = "A reproducible A-share research and backtesting system"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "pyarrow>=15",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aq = "quant_system.cli:main"

[tool.setuptools.packages.find]
include = ["quant_system*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

